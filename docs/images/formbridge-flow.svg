<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">How one booking travels through FormBridge</title>
  <desc id="d">Six steps between an AI assistant, FormBridge with the application's own form, and a person. The assistant calls a tool with values. The application's form checks them and nothing is saved. The assistant gets the form's answer. The person gets the real form, filled in. The person presses the button. The form checks again and the application's handler saves. The assistant has no tool that saves.</desc>
  <style>
    :root { --bg: #f5f7f6; --card: #ffffff; --fg: #18211f; --muted: #5b6966; --line: #c3cfcb; --accent: #0f6e66; --soft: #e2f1ee; --stop: #a3261e; --stop-soft: #fbe9e7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111715; --card: #18201e; --fg: #e6eceb; --muted: #9aa8a5; --line: #3a4a46; --accent: #5fc4b8; --soft: #17302c; --stop: #f28b82; --stop-soft: #3a201e; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .head { font-size: 17px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--muted); }
    .label { font-size: 14px; }
    .small { font-size: 13px; fill: var(--muted); }
    .num { font-size: 13px; font-weight: 700; fill: var(--card); }
    .lane { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .life { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 7; }
    .arrow { stroke: var(--accent); stroke-width: 2.5; fill: none; }
    .tip { fill: var(--accent); }
    .dot { fill: var(--accent); }
    .box { fill: var(--soft); stroke: var(--accent); stroke-width: 1.5; }
    .stop { fill: var(--stop-soft); stroke: var(--stop); stroke-width: 1.5; }
    .stop-text { fill: var(--stop); font-size: 13.5px; font-weight: 600; }

    /* Every step is visible by default, so the picture is complete wherever animation is off. */
    .s { animation: 20s linear infinite both; }
    .s1 { animation-name: a1; } .s2 { animation-name: a2; } .s3 { animation-name: a3; }
    .s4 { animation-name: a4; } .s5 { animation-name: a5; } .s6 { animation-name: a6; } .s7 { animation-name: a7; }
    @keyframes a1 { 0%, 2% { opacity: 0 } 5%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes a2 { 0%, 14% { opacity: 0 } 17%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes a3 { 0%, 26% { opacity: 0 } 29%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes a4 { 0%, 38% { opacity: 0 } 41%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes a5 { 0%, 50% { opacity: 0 } 53%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes a6 { 0%, 62% { opacity: 0 } 65%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes a7 { 0%, 74% { opacity: 0 } 77%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; } }
  </style>

  <rect width="960" height="600" rx="14" fill="var(--bg)"/>

  <!-- The three parties -->
  <rect class="lane" x="40" y="28" width="220" height="62" rx="10"/>
  <text class="head" x="150" y="55" text-anchor="middle">AI assistant</text>
  <text class="sub" x="150" y="75" text-anchor="middle">Claude, or a Symfony AI agent</text>

  <rect class="lane" x="340" y="28" width="280" height="62" rx="10"/>
  <text class="head" x="480" y="55" text-anchor="middle">FormBridge</text>
  <text class="sub" x="480" y="75" text-anchor="middle">with your own Symfony form and handler</text>

  <rect class="lane" x="700" y="28" width="220" height="62" rx="10"/>
  <text class="head" x="810" y="55" text-anchor="middle">A person</text>
  <text class="sub" x="810" y="75" text-anchor="middle">looking at the conversation</text>

  <line class="life" x1="150" y1="90" x2="150" y2="504"/>
  <line class="life" x1="480" y1="90" x2="480" y2="504"/>
  <line class="life" x1="810" y1="90" x2="810" y2="504"/>

  <!-- 1: the assistant calls the tool -->
  <g class="s s1">
    <text class="label mono" x="315" y="128" text-anchor="middle">create_booking(Friday, 2 seats, …)</text>
    <line class="arrow" x1="164" y1="142" x2="462" y2="142"/>
    <path class="tip" d="M474 142 l-14 -7 v14 z"/>
    <circle class="dot" cx="150" cy="142" r="13"/><text class="num" x="150" y="146.5" text-anchor="middle">1</text>
  </g>

  <!-- 2: the form checks -->
  <g class="s s2">
    <rect class="box" x="335" y="166" width="290" height="58" rx="8"/>
    <text class="label" x="496" y="190" text-anchor="middle">Your form checks the values.</text>
    <text class="label" x="496" y="210" text-anchor="middle" font-weight="600">Nothing is saved.</text>
    <circle class="dot" cx="358" cy="195" r="13"/><text class="num" x="358" y="199.5" text-anchor="middle">2</text>
  </g>

  <!-- 3: the answer goes back -->
  <g class="s s3">
    <text class="label" x="315" y="252" text-anchor="middle">“Friday has only 1 seat left”</text>
    <line class="arrow" x1="466" y1="266" x2="168" y2="266"/>
    <path class="tip" d="M156 266 l14 -7 v14 z"/>
    <circle class="dot" cx="480" cy="266" r="13"/><text class="num" x="480" y="270.5" text-anchor="middle">3</text>
  </g>

  <!-- 4: the person gets the real form -->
  <g class="s s4">
    <text class="label" x="645" y="304" text-anchor="middle">the real form, filled in,</text>
    <text class="label" x="645" y="322" text-anchor="middle">with the error on its field</text>
    <line class="arrow" x1="494" y1="336" x2="792" y2="336"/>
    <path class="tip" d="M804 336 l-14 -7 v14 z"/>
    <circle class="dot" cx="480" cy="336" r="13"/><text class="num" x="480" y="340.5" text-anchor="middle">4</text>
  </g>

  <!-- 5: the person presses the button -->
  <g class="s s5">
    <text class="label" x="645" y="386" text-anchor="middle">corrects it and presses Book</text>
    <line class="arrow" x1="796" y1="400" x2="498" y2="400"/>
    <path class="tip" d="M486 400 l14 -7 v14 z"/>
    <circle class="dot" cx="810" cy="400" r="13"/><text class="num" x="810" y="404.5" text-anchor="middle">5</text>
  </g>

  <!-- 6: checked again, then saved by the application's own handler -->
  <g class="s s6">
    <rect class="box" x="335" y="424" width="290" height="58" rx="8"/>
    <text class="label" x="496" y="448" text-anchor="middle">Your form checks again.</text>
    <text class="label" x="496" y="468" text-anchor="middle" font-weight="600">Your handler saves, once.</text>
    <circle class="dot" cx="358" cy="453" r="13"/><text class="num" x="358" y="457.5" text-anchor="middle">6</text>
  </g>

  <!-- What the assistant cannot do -->
  <g class="s s7">
    <rect class="stop" x="52" y="424" width="196" height="58" rx="8"/>
    <text class="stop-text" x="150" y="448" text-anchor="middle">The assistant has</text>
    <text class="stop-text" x="150" y="468" text-anchor="middle">no tool that saves</text>
  </g>

  <text class="small" x="480" y="536" text-anchor="middle">One attribute on your handler sets all of this up.</text>
  <text class="small mono" x="480" y="556" text-anchor="middle">#[AsFormTool(name: 'create_booking', form: BookingType::class, …)]</text>
</svg>
